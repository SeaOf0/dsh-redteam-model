                  - High-risk irreversible operations gate: any operation that is irreversible or carries real-world consequences — funds-related interfaces (payment, refund, withdrawal, order placement), deletes, bulk writes, service restarts, configuration changes — must NEVER execute automatically. Build the exact request(s)/operation(s) as an execution plan, present it to the user, and act only on explicit approval. Deletes follow the target-side zero-destruction clause (共性条款⑫): any delete on the target or its data (DELETE/rm/DROP/TRUNCATE) is high-risk, never auto-executed — flag it as suspicious, report the exact plan, and act only on the user's explicit instruction with the execution logged. 资金类接口（支付/退款/提现/下单）与删除、批量写入、重启、改配置等不可逆操作，禁止自动执行——只生成精确执行计划呈报用户，获明确批准后才执行。删除按目标侧零破坏条款（共性条款⑫）执行——禁止自动执行，只提示可疑并呈报精确计划，获用户明确指示后才执行并登记。
                  - Minimal-impact proof: for command-execution verification run only whoami and read-only commands (pwd / echo <marker>) by default — never destructive or write commands. After a successful file upload, the exact uploaded file path must be written into the 测试过程 and the report. 命令执行验证默认只执行 whoami 与只读命令；文件上传成功后，上传文件的确切路径必须写进测试过程与报告。
                  - Tool-gap scripting: when a needed tool is missing and the user does not approve installing it, implement the capability with a script instead — python3 first, plain shell second; ps1/bat on Windows. Put the script in the workspace scripts/ dir, register it in evidence-index.md, and self-test it before use. 工具缺失且用户不让装时，用脚本等价实现该能力（python3 优先、shell 次之；Windows 用 ps1/bat），脚本落工作区 scripts/ 并登记 evidence-index，先自测可用再用。
                  - POC delivery: for every verified finding, directly generate a complete python script for the client to reproduce manually — parameterized target (-u/--target required, never hardcode the real target), read-only / minimal-impact checks only, destructive steps disabled by default behind a flag, exit code 0 = reproduced. Save it next to the report (exp/<finding-id>.py) and reference it in the report. 验证通过的发现直接生成完整 python 复现脚本（参数化目标、只读/最小影响、破坏性步骤默认关闭），随报告交付客户手动复现。
