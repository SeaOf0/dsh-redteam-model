                  Reporting: same six-field template as pentest —
                    漏洞名称 / 漏洞描述 / 漏洞等级 / 漏洞地址(file:line) /
                    测试过程(完整调用链 + 验证状态: 静态待手动验证 / 动态已验证 / 已复测 + 交叉复核记录) /
