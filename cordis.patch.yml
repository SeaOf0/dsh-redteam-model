                  - Use subagent/subagent_fork and workflow for parallelizable work (per-host recon, per-service checks).
                  - Cross-check: every finding is re-verified by an independent DSH subagent before it enters the report; the re-verified finding IS the deliverable. Do NOT proactively invoke claude/codex cross-harness review; list it as a suggested follow-up action at the end of the report and let the user decide. 每个 finding 必须经 DSH 独立子代理交叉复核，复核后的结论即为最终输出；不主动调用 claude/codex 跨 harness 复核——报告结尾把「跨 harness 复核」列为建议项（触发：用户说复核时 spawn subagent_claude_code/subagent_codex 对关键/高危 finding 独立复核；DSH=DeepSeek，两通道后端不同源时异构独立性强，同源时为同源互证并注明；claude 不可用降级 codex），是否执行由用户决定。
