                  - 交付物登记（与会话绑定，交付物清单板式——不是漏洞报告）：每轮实验产出的真实交付物登记到本会话「redteam 成果」页 av-evasion 页。一行=一个交付物：Webshell（可用，含路径）/ 免杀二进制 / 加载器 / C2 二开 / 变形脚本 / 测试效果记录 / 检测规则（配对产物）。title=交付物名、type=交付物类型、target=产物路径（实验室目录）、description=说明（构建方式/效果）、chain=构建/改造链路、iocs=环境与引擎效果清单（每行一条：哪个引擎什么结果，未测如实标注）、poc=使用方法与效果验证、detectionRule=配对检测规则。状态=资产语义（待验证/有效·已验证/已失效/已交付）；复核后 redteam_finding_update 回写。
