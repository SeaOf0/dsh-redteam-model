name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugins:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install plugin deps
        # dsh-tools 0.2.1-rc.x 起 peer 面（ptc-runtime/sandbox/sandbox-policy/
        # working-directory）在 legacy-peer-deps 下不自动安装，显式补钉保持矩阵闭环。
        run: npm install --no-save @deepseek-ai/dsh-tools@0.2.1-rc.3 @deepseek-ai/schemastery@3.18.5 @deepseek-ai/dsh-ptc-runtime@0.2.1-rc.3 @deepseek-ai/dsh-sandbox@0.2.1-rc.3 @deepseek-ai/dsh-sandbox-policy@0.2.1-rc.3 @deepseek-ai/dsh-working-directory@0.2.1-rc.3
      - name: bridge cross-plugin packages
        run: |
          mkdir -p plugins/node_modules/@dsh-external
          for p in plugins/*/; do
            [ -f "${p}package.json" ] || continue
            name=$(node -p "require('./${p}package.json').name")
            case "$name" in
              @dsh-external/*) ln -sfn "../../$(basename "$p")" "plugins/node_modules/$name" ;;
            esac
          done
      - name: plugin test suites
        run: |
          status=0
          for p in plugins/*/; do
            if [ -f "${p}test/run.mjs" ]; then
              echo "== ${p}"
              (cd "$p" && node test/run.mjs) || status=1
            fi
          done
          exit $status

  manager:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install root dev dependencies
        run: npm ci
      - name: typecheck, build and test manager
        run: npm run check
      - name: verify committed manager bundles
        run: git diff --exit-code -- lib
