name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugins:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: plugin test suites
        run: |
          status=0
          for p in plugins/*/; do
            if [ -f "${p}test/run.mjs" ]; then
              echo "== ${p}"
              (cd "$p" && node test/run.mjs) || status=1
            fi
          done
          exit $status
